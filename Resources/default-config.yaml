# Utility 配置文件
# 存放路径: ~/.config/utility/config.yaml
# 修改后通过菜单栏「重载配置」或重启生效

ai:
  baseURL: https://api.deepseek.com
  apiKey: ''
  model: deepseek-v4-flash
clipboard:
  maxDays: 3
  excludeApps:
  - SecurityAgent
  - KeychainAccess
  hotkey: cmd+shift+c
  pollInterval: 0.3
translation:
  hotkey: option+d
  hotkeyOCR: option+s
  sourceLang: auto
  targetLang: auto
  firstLang: zh
  secondLang: en
  prompt: ''
stage:
  moveOnDragOut: false
rss:
  feeds: []
  updateInterval: 30
prompts:
  templates: {}
