# ~/.config/utility/config.yaml
# Utility 全局配置
# 修改后通过菜单栏「重载配置」生效（无需重启）

ai:
  baseURL: "https://api.deepseek.com"
  apiKey: ""
  model: "deepseek-v4-flash"

clipboard:
  maxDays: 3
  excludeApps:
    - "SecurityAgent"
    - "KeychainAccess"
  hotkey: "cmd+shift+c"
  maxItems: 1000
  pollInterval: 0.3

translation:
  hotkey: "option+d"
  hotkeyOCR: "option+d"
  sourceLang: "auto"
  targetLang: "zh"
  secondLang: "en"
  prompt: ""

stage:
  storageLimit: 50

rss:
  feeds: []
  updateInterval: 30

prompts:
  templates:
    summarize: "请用中文总结以下内容的要点，保持简洁"
    rewrite: "请用更专业的语气重写以下文本"
