# Utility configuration file
# Apply changes via the menu bar's "Reload config" or a restart

# ---------- Notifications ----------
notifications:
  enabled: true

# ---------- Runtime ----------
runtime:
  # Let the Python layer read this file itself instead of receiving each value as an env var.
  # false = the Swift host keeps injecting (default); true = config-surface env is skipped.
  # Runtime-only values (paths, ports, proxy, timeouts) are injected either way.
  selfManaged: false

# ---------- General ----------
general:
  # UI language. Leave empty to follow the system; valid values: zh / en
  # It also decides the prompt language and the language of MCP tool parameter
  # descriptions: the Python side uses it to pick `prompts/<lang>/*.md` and the
  # shared catalog (untranslated entries fall back to the Chinese baseline).
  language: ''

  # Enable the system proxy. When on, macOS system proxy settings are read automatically.
  proxyEnabled: false

  # Logging (applies to debug.log and every Python module logger under ~/.cache/utility/)
  logMaxSize: 10485760  # max log file size in bytes before rotation (default 10MB)
  logBackupCount: 3     # max rotated backups kept per log file

  # HTTP timeout
  httpTimeout: 30       # default HTTP request timeout in seconds
  httpRetryCount: 0     # HTTP request retry count

  # AI client timeout (default in Swift `ConfigDefaults.defaultAITimeout`)
  aiTimeout: 120        # AI API request timeout in seconds; 0 = unlimited

# ---------- AI ----------
ai:
  # OpenAI-compatible API base URL (host only; the client appends /chat/completions)
  baseURL: ''
  # API key
  apiKey: ''
  # Model name, e.g. your-model
  model: ''
  # Single-shot LLM inference timeout in seconds; 0 or negative = use the default
  # (Swift `ConfigDefaults.llmTimeout`). Applies to the three LLM call sites on the
  # Python side (single summary / batch aggregate / rule extraction) and really gets
  # hit with a slow model (reasoning models, long context).
  # **Not the same as general.aiTimeout above**: that one is the agent subprocess
  # timeout (AGENT_TIMEOUT) — a different order of magnitude and meaning.
  llmTimeout: 120

# ---------- Model proxy ----------
modelProxy:
  enabled: false
  # Compat: the single upstream address when providers is empty
  url: ''
  # Local proxy listen port; 0 = auto-detect a free port
  port: 0
  # Max restarts after the proxy process crashes / delay in ms before restarting (same as the mcp section)
  maxRestarts: 3
  restartDelayMs: 2000
  # Full-text skill dedup: when the same skill is called repeatedly, the second copy
  # onward is replaced with a short notice (the first full text is kept).
  # The notice language follows general.language (shared catalog: zh-Hans / en).
  skillDedupEnabled: true
  # Append one line at the end of the response showing what the proxy rewrote this round,
  # e.g. `your-model | context 120K | applied: shell filter / skill short notice`. Added only to final
  # text replies, not to tool-call turns.
  responseAnnotationEnabled: true
  # That line also reports the context size and, past this many tokens, suggests starting a
  # new session (0 = never suggest). 300000 is an empirical threshold where reply latency
  # starts to climb; tune it for the actual model and machine.
  contextWarnTokens: 300000
  # Shell tool output slimming: trim head/tail of overlong output (with a self-evident
  # marker) + lossless JSON minify. Only applies to shell-like tools — Read/Edit etc.
  # return file content the model explicitly asked for, truncating it is corruption.
  outputFilter:
    enabled: true
    # Only outputs larger than this many bytes are trimmed. Measured Bash output:
    # P95=5398, P99=13161 — 12000 keeps a 2.2x margin, so 98.9% of calls are untouched.
    maxBytes: 12000
    formatCompress: true
    # Folding consecutive repeated lines changes the line count (not lossless), so off by default.
    foldRepeatedLines: false
    bypassTools: []
    # Extra shell tool names. Names differ across clients (Gemini=run_shell_command,
    # Cursor=run_terminal_cmd, Codex=local_shell), hence a config surface; incremental.
    shellTools: []
    # Per-command rules; empty by default (measured: this project's shell output has no
    # template noise, so hardcoded rules would only delete the wrong things).
    #  - command: npm
    #    subcommand: install
    #    maxBytes: 2000
    #    dropLines: ["^npm warn"]
    #    keepLines: []
    rules: []
  # Model routing table: body.model exactly matches a provider's models -> that provider
  # (the upstream model keeps the original value); no match -> providers[0] fallback
  # (the upstream model uses its models[0]).
  # apiFormat: anthropic | openai; protocol conversion is applied when the client format differs.
  # apiKey: provider key substituted when forwarding; if empty, the client key is passed through.
  providers: []
  # Example:
  #   - name: example
  #     url: 'https://api.example.com/anthropic'
  #     apiFormat: anthropic
  #     apiKey: ''
  #     models:
  #       - your-model

  # Client allowlist: which clients get the thinking-disabled speedup for classifier
  # (safety classification) requests. Client identity is not a protocol fact, so it is not
  # hardcoded — other agent clients just append in the same shape.
  # Built-in defaults already include claude-code; this section is **incremental**
  # (same name overrides, new names append).
  # Matching: any userAgentContains hits **and** all headerPresent are present (both empty = no match).
  clientAccel:
    enabled: true
    clients: []
    #  - name: my-agent
    #    userAgentContains: ['my-agent']
    #    headerPresent: []

  # Client-injected text/labels: continuation prompts, summary prefixes, injected tags.
  # Values differ per client and change across versions, hence a config table; this section
  # is **incremental** (built-in defaults come first).
  # A long message matching no registered text logs client_text_miss (debug), so a new
  # client's text can be discovered instead of silently polluting actual_user_input and
  # the session-key anchor.
  clientText:
    continuationPrefixes: []
    summaryPrefixes: []
    injectedTags: []

# ---------- MCP ----------
mcp:
  enabled: true
  # Local MCP service port; 0 = auto-detect a free port
  port: 0

  # Data storage paths (empty string = use the defaults ~/.config/utility/data/ and ~/.config/utility/notes/)
  qdrantPath: ''
  knowledgeBasePath: ''

  # Note scanning (recall + daily summary). Empty = skip nothing;
  # non-empty = full override (not incremental). Names match at any depth,
  # so both "Private" and "/notes/Private" work. Add "Extracts" here if the
  # summary must not rescan its own output.
  noteExcludeDirs: []

  # Note file extensions. Empty = built-in generic set
  # (.md/.txt/.py/.yaml/.yml/.json/.toml); non-empty = full override.
  # "md", ".MD" and "*.md" are all accepted; matching is case-insensitive.
  noteExtensions: []

  # fastembed model cache (empty string = default ~/.cache/utility/fastembed/)
  fastembedCacheDir: ''
  # Empty string = use the built-in default model sentence-transformers/all-MiniLM-L6-v2
  embedderModel: ''

  # Memory lifecycle
  hotRetentionDays: 180
  archiveDays: 90

  # Daily summary (triggered by TaskScheduler, runs summarize.py)
  summaryEnabled: true
  summaryHour: 17

  # Summary exclude tags: memories carrying these tags do not sediment into the knowledge
  # base (workflow/format-ish, not technical knowledge)
  excludeTags:

  # Search synonym expansion: expand Chinese query terms into the matching English terms,
  # used by full-text search such as project_search.
  # **Incremental** semantics — same key overrides a built-in, new keys append; write only
  # what you want to add, no need to copy the whole built-in table (it lives in
  # Sources/MCPScripts/utility/core/synonyms.py). Restart the MCP service for changes to take effect.
  synonyms: {}
    # 部署: "deploy release publish"
    # 请求: "request http call"

  # Tool argument defaults: tool name -> args name -> value. **Incremental** semantics —
  # same name overrides a built-in; write only what you want to change (the built-in table
  # is in Sources/MCPScripts/utility/core/tool_defaults.py). These defaults directly decide how much each
  # tool call returns (token cost). Restart the MCP service for changes to take effect.
  toolDefaults:
    recall:
      limit: 6
    project_search:
      limit: 15
    project_structure:
      limit: 15
    project_dependencies:
      limit: 30
    websearch_engine:
      limit: 5
      fetch_top: 1
      max_chars: 6000
    read_url:
      max_chars: 0              # 0 = unlimited; positive = explicit cap

  # Process supervision
  maxRestarts: 3
  restartDelayMs: 2000

clipboard:
  maxDays: 3
  excludeApps:
  - SecurityAgent
  - KeychainAccess
  hotkey: cmd+shift+c
  pollInterval: 0.3

# ---------- Prompts ----------
# Prompt templates are **file**-based (Swift translation and Python summarization share the
# same directory and the same contract):
#   user override: <config dir>/prompts/<feature>.md   (~/.config/utility/prompts/, language-independent)
#   bundled: MCPScripts/prompts/<lang>/<feature>.md
# A custom file is not split by language — whoever writes a prompt has one native language,
# and switching the UI language should not invalidate it.
# Bundled templates are split by language: the language comes from general.language, and a
# missing file for that language falls back to the zh-Hans baseline (with a warning).
# To customize: copy a bundled file to the same relative path under the config directory and
# edit it; the front-matter (name / placeholders) must match the body, or it is rejected and
# the bundled version is used instead.
prompts:
  # Inline templates, taking precedence **over** the files above; handy for a quick experiment.
  # The key is the feature (translate / translate_auto) and the value is a template with
  # {source}/{target} placeholders. For long-term customization prefer files, which are
  # easier to version and reuse.
  templates: {}

translation:
  hotkey: option+d
  hotkeyOCR: option+s
  sourceLang: auto
  targetLang: auto
  firstLang: zh
  secondLang: en
  # Inline override of the translation system prompt (highest priority; when empty, the prompt
  # template file is used). Supports the {source} / {target} placeholders.
  prompt: ''

# ---------- Knowledge panel ----------
knowledge:
  enabled: true
  refillIntervalMinutes: 30     # refill wake-up beat; keep it larger than one run
  autoShowEnabled: true
  autoShowIntervalMinutes: 120  # auto-pop the panel every N minutes
  autoCloseSeconds: 25          # auto-close after N seconds once the panel loses focus; 0 = never
  poolTargetTopic: 5            # refill until this many unseen (shown_count = 0) cards exist
  maxFailStreak: 3              # N dry runs in a row marks a topic done
  maxShownPerCard: 2            # review cap when showReviewedCards is enabled
  retentionDays: 365            # prune cards older than N days on refill; liked cards are kept; 0 = keep forever
  hotkey: option+k
  saveLikedMarkdown: true       # save the current card when Like is clicked
  likedSaveDir: ''              # empty = <mcp.knowledgeBasePath>/知识卡片 (or default notes dir)
  showReviewedCards: false      # false = only unseen cards; true = fall back to old cards
  # Topic lines: concepts are pushed in order. kind: principle | trend
  # scope / exclude are the hard boundaries of concept selection. Keep scope to the
  # topic's textbook table of contents; list products, vendor solutions and industry
  # trends under exclude. Empty scope = the topic's own textbook TOC.
  topics:
    - name: TCP/IP 协议栈
      kind: principle
      scope: 分层模型、寻址、路由、传输、应用层协议的机制与设计原理
      exclude: 厂商设备与产品、云原生与容器基础设施、网络运维体系、行业趋势与近五年新词
    - name: 编译原理
      kind: principle
      scope: 词法分析、语法分析、中间表示、优化、代码生成、运行时等编译阶段的机制与原理
      exclude: 具体编译器产品与 IDE、工程构建工具、行业趋势与近五年新词

stage:
  moveOnDragOut: true

# Scheduled tasks
tasks: []
  # - name: daily-report
  #   trigger: '0 18 * * *'
  #   exec: shortcuts://daily-summary
  #   enabled: true
  #   mode: cron     # cron (default) or manual
  # - name: cleanup-temp
  #   trigger: '0 3 * * 1'
  #   exec:
  #     type: sh
  #     command: rm -rf /tmp/myapp-*

# ---------- RSS ----------
rss:
  feeds: []
  # Built-in daily digest task (menu bar can also trigger it manually).
  daily:
    enabled: false
    cron: "0 10 * * *"   # empty string = manual trigger only
    outputDir: ""        # empty = <NOTES_DIR>/RSS, archived as YYYY/<quarter>/YYYY-MM-DD.md
    markRead: true
    maxConcurrency: 4
    articleMaxChars: 12000
    filterBatch: 40
    summaryBatch: 4
    maxDigestLinks: 10
    fetchTimeout: 20
    llmTimeout: 120
    # Optional: switch a Clash proxy group while fetching, then restore it.
    # group/target are your own Clash group names; leave empty to disable the switch.
    clash:
      enabled: false
      group: ""
      target: ""
