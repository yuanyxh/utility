# Utility 配置文件
# 修改后通过菜单栏「重载配置」或重启生效

# ---------- 通知 ----------
notifications:
  enabled: true

# ---------- 通用 ----------
general:
  # 界面语言。留空跟随系统，可选值: zh / en
  language: ''

  # 是否启用系统代理。启用时自动读取 macOS 系统代理设置
  proxyEnabled: false

  # 日志配置
  logMaxSize: 10485760  # 日志文件最大大小（字节），默认 10MB
  logBackupCount: 3     # 日志备份数量

  # HTTP 超时配置
  httpTimeout: 30       # HTTP 请求默认超时（秒）
  httpRetryCount: 0     # HTTP 请求重试次数

  # AI 客户端超时
  aiTimeout: 120        # AI API 请求超时（秒）

# ---------- AI ----------
ai:
  # OpenAI 兼容 API 地址（只需 host，客户端自动追加 /chat/completions）
  baseURL: ''
  # API 密钥
  apiKey: ''
  # 模型名，例如 deepseek-v4-flash / gpt-4o-mini
  model: ''

# ---------- 模型代理 ----------
modelProxy:
  enabled: false
  # 兼容：providers 为空时的单一上游地址
  url: ''
  # 本地代理监听端口，0 = 自动检测可用端口
  port: 0
  # 代理进程崩溃后的最大重启次数 / 重启前等待毫秒数（与 mcp 段同义）
  maxRestarts: 3
  restartDelayMs: 2000
  # 模型路由表：body.model 精确匹配某 provider.models → 路由到该 provider（上游 model 用原值）；
  # 未匹配 → providers[0] 兜底（上游 model 用其 models[0]）。
  # apiFormat: anthropic | openai，客户端格式不同时做协议转换。
  # apiKey: 转发时替换的 provider key，为空则透传客户端 key。
  providers:
    - name: deepseek
      url: 'https://api.deepseek.com/anthropic'
      apiFormat: anthropic
      apiKey: ''
      models:
        - deepseek-v4-flash
    - name: mimo
      url: 'https://api.xiaomimimo.com/anthropic'
      apiFormat: anthropic
      apiKey: ''
      models:
        - mimo-v2.5-pro

  # 分级路由：按任务分类选择档位，会话内「单调不降」。
  # 不配置或 enabled=false 则保持手动切换行为（行为与引入本特性前完全一致）。
  #
  # 键名 camelCase / snake_case 两种写法都认（Yams 的 YAMLDecoder 不做键名转换，
  # 因此解码侧对每个键都显式登记了两种拼写）。下面统一用 camelCase。
  #
  # 判据全部来自 Anthropic / OpenAI 协议字段（工具失败走 tool_result.is_error、
  # 打转走工具名+入参、循环位置走消息结构），不含任何客户端产品实现细节，
  # 因此可服务任意 agent 客户端与任意 OpenAI/Anthropic 格式请求。
  router:
    enabled: false
    # 档位定义。**数组顺序 = 强度从高到低**（索引 0 最强）。
    # description 会被拼进分类 prompt，因此新增档位（如 medium）只需改配置。
    # model 必须在上面 providers 的某个 models 列表里。
    tiers:
      - name: strong
        model: deepseek-v4-flash
        description: 需要深度推理、多步分析、复杂调试、架构设计
      - name: weak
        model: mimo-v2.5
        description: 日常编码、简单问答、工具执行、文件操作
    # 分类器配置
    classifier:
      provider: deepseek        # 引用 providers 中的 name
      maxRetries: 3
      retryDelayMs: 500         # 重试间隔（毫秒）
      timeoutMs: 10000          # 单次分类请求超时（毫秒）
      # 分类器**总**时间预算（毫秒）。单次超时 × 重试次数会全部叠加在转发前的
      # 关键链路上，故设总闸：预算耗尽即放弃分类走兜底档，不把请求卡死。
      totalBudgetMs: 3000
      # 分类 prompt 模板，支持 {tier_lines} 与 {last_user_message} 占位；
      # 留空则用内置默认模板
      promptTemplate: ''
    # 分类失败 / 无分类器时的兜底档名；留空则取最后一档（最弱）
    defaultTier: weak

    policy:
      # 结构判定的非 agent 请求（stream 为假 + 无 tools + messages ≤ 2，即 Claude Code
      # 的 safety classifier 调用）直通兜底档，不建会话、不调分类器。
      # 关闭它会让每条 classifier 请求多一次 LLM 分类调用，而该路径在工具批准的关键链路上。
      classifierFastPath: true
      # 双向切档回本轮数。定量依据：设 Ps/Pw 为两档输入未命中价、c 为缓存折扣
      # （命中价/未命中价，Anthropic≈0.10、deepseek≈0.26），则
      #   M* = 2 + [Pw + Ps(1-2c)] / [c(Ps-Pw)]
      # 该式与上下文规模无关，对价差极不敏感、对 c 极敏感：
      # c=0.10 时 M*≈12，c=0.26 时 M*≈4.5。按你的 provider 实际折扣反推。
      switchCostTurns: 12
      # 连续同名同参工具调用达到此数即判定打转 → 升档
      loopStreak: 3
      # 连续多少轮工具失败才升档。1 = 单次失败即升档（不推荐：is_error 是客户端按
      # 「非零退出」判定的，grep 无匹配 / diff 有差异 / test 失败都会被标 true）
      escalateErrorStreak: 2
      # 每 N 轮强制升档一次（is_error 不可用时的主力兜底），0 = 禁用。
      # 按「距上次检查点的轮数」计，不是绝对轮次；已降档的会话自动抬到
      # switchCostTurns，保证弱档段撑得到回本，否则降档恒亏（见下）。
      checkpointInterval: 30
      # 降档判定回看的工具调用次数。取尾部 N 次，反映「当前段」而非全量历史。
      # 调大更保守、调小更激进。**不要设成很大来「回到全量历史」**：全量会让
      # 用过一次 Bash 的会话永久无法降档（真实 Agent 会话必然含 Bash），
      # 实测使降档通道 100% 失效（122 次尝试 0 次放行）。
      downgradeWindow: 8
      # 内容层兜底正则（仅当 provider 不返回 is_error 时才需要）
      escalatePatterns: []
      # 只读工具白名单。**默认空 = 永不允许降档**（对通用 agent 最保守）；
      # 填了才启用降档，且必须同时满足「已确认无失败」与「剩余轮数够回本」。
      # 判定只看最近 downgradeWindow 次工具调用：那段全是只读工具才可能降档。
      # 因此只填真正的只读工具（Bash/Edit/Write 等写操作工具不入此列）。
      readonlyTools: []
      # 正常终止原因；留空用协议默认 {end_turn, tool_use, stop_sequence}
      normalStopReasons: []
      # 切档前要求工具调用配对完整（防严格上游 400，已知故障模式）
      requirePairedHistory: true

    # 会话身份。合法分量：system / tools / first_user / latest_user / profile。
    # 默认 first_user：锚定**整个对话**——同一对话内的多次用户交互（反馈确认、
    # 决策回复、追加指令）共享一个会话，档位不会因为一句「A 吧」被重新分类。
    # 早先默认用 latest_user，它让每次用户发言都开新会话，同一任务内的确认/
    # 决策回复被当成独立新任务重新分类（实测一段连续 9 次请求的对话被判成
    # 9 个新会话、9 次 weak），任务执行段的档位与初始判定脱节。
    # 代价：同一对话里换新任务不再自动重分类，由「段性质」驱动的会话内双向
    # 切换补上——纯只读段降档、写操作段升回（可多次）。
    # ⚠️ 出现未知分量时整组退回默认（不会只剔除该项——那会让键退化成
    #    「每个 agent 类型一个常量键」，所有会话共用一个状态）。
    conversation:
      keyParts: [system, tools, first_user]
      # 0 = 不限制会话数（与 ttlSeconds: 0 表示不过期一致）
      maxSessions: 512
      ttlSeconds: 7200

    # agent 类型先验：profile_key = system+tools 指纹。子 agent 的 system prompt
    # 与裁剪过的工具集与主 agent 天然不同，自动隔离，无需客户端配合。
    # 历史升级率低于阈值的 profile 直接按先验档起步并跳过 LLM 分类——
    # 重复劳动任务「第一次学、之后免检」。
    profile:
      enabled: true
      minSamples: 5
      # 真实滑动窗口：所有派生值（升级率、预期轮数）都只取窗口内样本，
      # 不是「全生命周期比率 + 最近 N 条中位数」这种混用两个口径。
      window: 50
      upgradeRateThreshold: 0.1
      priorTier: ''             # 留空 = 最低档
      # 内存中保留的 profile 条目上限（有界，防本机任意进程驱动无界增长）
      maxProfiles: 256

# ---------- MCP ----------
mcp:
  enabled: true
  # 本地 MCP 服务端口，0 = 自动检测可用端口
  port: 0

  # 数据存储路径（空字符串 = 使用默认路径 ~/.utility/data/ 和 ~/.utility/notes/）
  qdrantPath: ''
  knowledgeBasePath: ''

  # fastembed 模型缓存（空字符串 = 使用默认路径 ~/.cache/utility/fastembed/）
  fastembedCacheDir: ''
  # 空字符串 = 使用内置默认模型 sentence-transformers/all-MiniLM-L6-v2
  embedderModel: ''

  # 记忆生命周期
  hotRetentionDays: 180
  archiveDays: 90

  # 每日总结（由 TaskScheduler 触发 summarize.py）
  summaryEnabled: true
  summaryHour: 17

  # 总结排除 tag：含这些 tag 的记忆不进入知识库沉淀（工作流/格式类，非技术知识）
  excludeTags:

  # 进程守护
  maxRestarts: 3
  restartDelayMs: 2000

clipboard:
  maxDays: 3
  excludeApps:
  - SecurityAgent
  - KeychainAccess
  hotkey: cmd+shift+c
  pollInterval: 0.3

translation:
  hotkey: option+d
  hotkeyOCR: option+s
  sourceLang: auto
  targetLang: auto
  firstLang: zh
  secondLang: en
  prompt: ''

stage:
  moveOnDragOut: true

# 定时任务
tasks: []
  # - name: 日报提醒
  #   trigger: '0 18 * * *'
  #   exec: shortcuts://日报汇总
  #   enabled: true
  #   mode: cron     # cron (默认) 或 manual
  # - name: 清理临时文件
  #   trigger: '0 3 * * 1'
  #   exec:
  #     type: sh
  #     command: rm -rf /tmp/myapp-*

# ---------- RSS ----------
rss:
  feeds: []
