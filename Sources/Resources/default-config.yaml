# Utility 配置文件
# 修改后通过菜单栏「重载配置」或重启生效

# ---------- 通知 ----------
notifications:
  enabled: true

# ---------- 通用 ----------
general:
  # 界面语言。留空跟随系统，可选值: zh / en
  language: ''

# ---------- AI ----------
ai:
  # OpenAI 兼容 API 地址（只需 host，客户端自动追加 /chat/completions）
  baseURL: ''
  # API 密钥
  apiKey: ''
  # 模型名，例如 deepseek-v4-flash / gpt-4o-mini
  model: ''
clipboard:
  maxDays: 3
  excludeApps:
  - SecurityAgent
  - KeychainAccess
  hotkey: cmd+shift+c
  pollInterval: 0.3
translation:
  hotkey: option+d
  hotkeyOCR: option+s
  sourceLang: auto
  targetLang: auto
  firstLang: zh
  secondLang: en
  prompt: ''
stage:
  moveOnDragOut: true
rss:
  feeds: []
prompts:
  templates: {}
# ------------------------------------------------------------------
# 定时任务
tasks: []
  # - name: 日报提醒
  #   trigger: '0 18 * * *'
  #   exec: shortcuts://日报汇总
  #   enabled: true
  #   mode: cron     # cron (默认) 或 manual
  # - name: 清理临时文件
  #   trigger: '0 3 * * 1'
  #   exec:
  #     type: sh
  #     command: rm -rf /tmp/myapp-*

# ---------- MCP 记忆服务 ----------
mcp:
  enabled: true
  port: 9001

  # 数据存储路径
  qdrantPath: "~/Documents/selfdata/database/qdrant_data"
  knowledgeBasePath: "~/Documents/selfdata/notes"

  # fastembed 模型缓存
  fastembedCacheDir: "~/.cache/fastembed_cache"
  embedderModel: "sentence-transformers/all-MiniLM-L6-v2"

  # 记忆生命周期
  hotRetentionDays: 180
  archiveDays: 90

  # 每日总结（由 TaskScheduler 触发 summarize.py）
  summaryEnabled: true
  summaryHour: 17
  summaryStatsOnly: false  # true=仅统计报表，跳过 AI 总结

  # 进程守护
  maxRestarts: 3
  restartDelayMs: 2000

# ---------- 模型代理 ----------
modelProxy:
  enabled: false
  url: ''
  port: 8613
