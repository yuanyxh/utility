# Utility 配置文件
# 修改后通过菜单栏「重载配置」或重启生效

# ---------- 通知 ----------
notifications:
  enabled: true

# ---------- 通用 ----------
general:
  # 界面语言。留空跟随系统，可选值: zh / en
  language: ''

  # 日志配置
  logMaxSize: 10485760  # 日志文件最大大小（字节），默认 10MB
  logBackupCount: 3     # 日志备份数量

  # HTTP 超时配置
  httpTimeout: 30       # HTTP 请求默认超时（秒）
  httpRetryCount: 0     # HTTP 请求重试次数

  # AI 客户端超时
  aiTimeout: 120        # AI API 请求超时（秒）

# ---------- AI ----------
ai:
  # OpenAI 兼容 API 地址（只需 host，客户端自动追加 /chat/completions）
  baseURL: ''
  # API 密钥
  apiKey: ''
  # 模型名，例如 deepseek-v4-flash / gpt-4o-mini
  model: ''

# ---------- 模型代理 ----------
modelProxy:
  enabled: false
  # 兼容：providers 为空时的单一上游地址
  url: ''
  # 本地代理监听端口，0 = 自动检测可用端口
  port: 0
  # 模型路由表：body.model 精确匹配某 provider.models → 路由到该 provider（上游 model 用原值）；
  # 未匹配 → providers[0] 兜底（上游 model 用其 models[0]）。
  # apiFormat: anthropic | openai，客户端格式不同时做协议转换。
  # apiKey: 转发时替换的 provider key，为空则透传客户端 key。
  providers:
    - name: deepseek
      url: 'https://api.deepseek.com/anthropic'
      apiFormat: anthropic
      apiKey: ''
      models:
        - deepseek-v4-flash
    - name: mimo
      url: 'https://api.xiaomimimo.com/anthropic'
      apiFormat: anthropic
      apiKey: ''
      models:
        - mimo-v2.5-pro

# ---------- 文章生成 ----------
article:
  enabled: false
  # agent CLI 命令模板，占位符 {system_prompt_file}/{prompt_file} 由脚本替换。
  # ⚠️ GUI/LaunchAgent 启动的任务子进程 PATH 不含 /opt/homebrew/bin 等用户工具目录，
  # agent 主命令必须写绝对路径（如 /opt/homebrew/bin/claude），否则启动即失败。
  # 空字符串 = 未配置，启用时报错提示用户配置。
  agentCli: ''
  # 生成后自动验证，硬门槛不满足自动重跑次数
  retries: 5
  # 生成后启用 LLM-as-Judge 管道式评估（素材校验 + 文章二次检测）
  judge: true

mcp:
  enabled: true
  # 本地 MCP 服务端口，0 = 自动检测可用端口
  port: 0

  # 数据存储路径（空字符串 = 使用默认路径 ~/.utility/data/ 和 ~/.utility/notes/）
  qdrantPath: ''
  knowledgeBasePath: ''

  # fastembed 模型缓存（空字符串 = 使用默认路径 ~/.cache/utility/fastembed/）
  fastembedCacheDir: ''
  # 空字符串 = 使用内置默认模型 sentence-transformers/all-MiniLM-L6-v2
  embedderModel: ''

  # 记忆生命周期
  hotRetentionDays: 180
  archiveDays: 90

  # 每日总结（由 TaskScheduler 触发 summarize.py）
  summaryEnabled: true
  summaryHour: 17
  summaryStatsOnly: false  # true=仅统计报表，跳过 AI 总结

  # 总结排除 tag：含这些 tag 的记忆不进入知识库沉淀（工作流/格式类，非技术知识）
  excludeTags:

  # 进程守护
  maxRestarts: 3
  restartDelayMs: 2000

clipboard:
  maxDays: 3
  excludeApps:
  - SecurityAgent
  - KeychainAccess
  hotkey: cmd+shift+c
  pollInterval: 0.3
translation:
  hotkey: option+d
  hotkeyOCR: option+s
  sourceLang: auto
  targetLang: auto
  firstLang: zh
  secondLang: en
  prompt: ''
stage:
  moveOnDragOut: true
# ------------------------------------------------------------------
# 定时任务
tasks: []
  # - name: 日报提醒
  #   trigger: '0 18 * * *'
  #   exec: shortcuts://日报汇总
  #   enabled: true
  #   mode: cron     # cron (默认) 或 manual
  # - name: 清理临时文件
  #   trigger: '0 3 * * 1'
  #   exec:
  #     type: sh
  #     command: rm -rf /tmp/myapp-*

# ---------- MCP 记忆服务 ----------
rss:
  feeds: []
