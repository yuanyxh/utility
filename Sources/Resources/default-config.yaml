# Utility 配置文件
# 修改后通过菜单栏「重载配置」或重启生效

# ---------- 通用 ----------
general:
  # 界面语言。留空跟随系统，可选值: zh / en
  language: ''

# ---------- AI ----------
ai:
  # OpenAI 兼容 API 地址（只需 host，客户端自动追加 /chat/completions）
  baseURL: ''
  # API 密钥
  apiKey: ''
  # 模型名，例如 deepseek-v4-flash / gpt-4o-mini
  model: ''
clipboard:
  maxDays: 3
  excludeApps:
  - SecurityAgent
  - KeychainAccess
  hotkey: cmd+shift+c
  pollInterval: 0.3
translation:
  hotkey: option+d
  hotkeyOCR: option+s
  sourceLang: auto
  targetLang: auto
  firstLang: zh
  secondLang: en
  prompt: ''
chat:
  hotkey: option+space
  # @ 规则：在聊天框输入 @name content，自动执行命令并获取输出
  # {content} 会被替换为 @name 之后的内容
  atRules: []
    # - name: hermes
    #   command: hermes chat -q "{content}"
stage:
  moveOnDragOut: true
rss:
  feeds: []
  updateInterval: 60
prompts:
  templates: {}
# ------------------------------------------------------------------
# 定时任务
tasks: []
